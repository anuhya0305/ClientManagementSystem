<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="userSignUp.css">
</head>

<body>

<div class="container">

    <h2>User Registration</h2>

    <form action="signUp.jsp" method="post">

        <input type="text"
               name="firstName"
               placeholder="First Name"
               required>

        <input type="text"
               name="lastName"
               placeholder="Last Name"
               required>

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="password"
               name="loginPassword"
               placeholder="Password"
               required>

        <input type="submit"
               value="Register"
               class="btn">

    </form>

    <a href="index.html" class="back">Home</a>

</div>

</body>
</html>
