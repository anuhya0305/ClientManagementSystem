<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>

    <link rel="stylesheet" href="forgotPasswordForm.css">
</head>

<body>

<div class="container">

    <h2>Forgot Password</h2>

    <form action="updateNewPassword.jsp" method="post">

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="password"
               name="newPassword"
               placeholder="New Password"
               required>

        <input type="submit"
               value="Update Password"
               class="btn">

    </form>

    <a href="index.html" class="back">Home</a>

</div>

</body>
</html>
