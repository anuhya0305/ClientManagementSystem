<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="userSignIn.css">
</head>

<body>

<div class="container">

    <h2>User Login</h2>

    <form action="signIn.jsp" method="post">

        <input
                type="text"
                name="username"
                placeholder="Username"
                required>

        <input
                type="password"
                name="loginPassword"
                placeholder="Password"
                required>

        <input
                type="submit"
                value="Login"
                class="btn">

    </form>

    <a href="index.html" class="back">Home</a>

</div>

</body>
</html>
